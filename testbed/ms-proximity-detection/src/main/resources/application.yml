server:
  port: 8083

# Zero Trust primitives are selected with independent flags (ZT_AC4A, ZT_MTLS,
# ZT_SR, ZT_RA — see testbed/variants/*.env). For this Kafka consumer, p2
# verifies the JWT propagated in the record header and p3 switches the broker
# connection to the mutually-authenticated SSL listener.

spring:
  application:
    name: ms-proximity-detection
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: proximity-detection-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

jwt:
  secret: ${JWT_SECRET:trustlens-dev-secret-key-256bit!!}
  expiration-ms: 3600000

kafka:
  topic:
    location: user.location.updated
    violations: proximity.violation.detected
