# Closed-loop, p3 ON: upstreams on the extra mTLS connectors (9443).
# p3 ON — gateway→service traffic over mutual TLS. The gateway presents its
# client certificate; services require it (server.ssl.client-auth=need).
# Upstream keep-alive pools amortise the TLS handshake (ZT-Tax lesson: the
# mTLS mechanism, not the primitive, drives its overhead).
# p1 (perimeter control): single ingress point for all North-South traffic.
worker_processes auto;

events {
  worker_connections 16384;
  use epoll;
  multi_accept on;
}

http {
  access_log off;

  upstream ms_user {
    server ms-user:9443;
    keepalive 64;
    keepalive_requests 1000000;
    keepalive_timeout  60s;
  }
  upstream ms_location {
    server ms-location:9443;
    keepalive 64;
    keepalive_requests 1000000;
    keepalive_timeout  60s;
  }

  server {
    listen 8080;
    keepalive_requests 1000000;
    keepalive_timeout  65;

    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

    location /auth/ {
      proxy_pass https://ms_user;
      proxy_ssl_certificate          /etc/nginx/certs/gateway/cert.pem;
      proxy_ssl_certificate_key      /etc/nginx/certs/gateway/key.pem;
      proxy_ssl_trusted_certificate  /etc/nginx/certs/ca.crt;
      proxy_ssl_verify               on;
      proxy_ssl_session_reuse        on;
      proxy_ssl_name                 ms-user;
    }

    location /users/ {
      proxy_pass https://ms_user;
      proxy_ssl_certificate          /etc/nginx/certs/gateway/cert.pem;
      proxy_ssl_certificate_key      /etc/nginx/certs/gateway/key.pem;
      proxy_ssl_trusted_certificate  /etc/nginx/certs/ca.crt;
      proxy_ssl_verify               on;
      proxy_ssl_session_reuse        on;
      proxy_ssl_name                 ms-user;
    }

    location /location/ {
      proxy_pass https://ms_location;
      proxy_ssl_certificate          /etc/nginx/certs/gateway/cert.pem;
      proxy_ssl_certificate_key      /etc/nginx/certs/gateway/key.pem;
      proxy_ssl_trusted_certificate  /etc/nginx/certs/ca.crt;
      proxy_ssl_verify               on;
      proxy_ssl_session_reuse        on;
      proxy_ssl_name                 ms-location;
    }

    location /health {
      return 200 "gateway ok\n";
      add_header Content-Type text/plain;
    }
  }
}
