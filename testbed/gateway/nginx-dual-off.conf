# p3 OFF — gateway→service traffic in plain HTTP/1.1 (persistent connections).
# p1 (perimeter control): single ingress point for all North-South traffic.
worker_processes auto;

events {
  worker_connections 16384;
  use epoll;
  multi_accept on;
}

http {
  access_log off;

  upstream ms_user {
    server ms-user:8081;
    keepalive 64;
    keepalive_requests 1000000;
    keepalive_timeout  60s;
  }
  upstream ms_location {
    server ms-location:8082;
    keepalive 64;
    keepalive_requests 1000000;
    keepalive_timeout  60s;
  }

  server {
    listen 8080;
    keepalive_requests 1000000;
    keepalive_timeout  65;

    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

    location /auth/ {
      proxy_pass http://ms_user;
    }

    location /users/ {
      proxy_pass http://ms_user;
    }

    location /location/ {
      proxy_pass http://ms_location;
    }

    location /health {
      return 200 "gateway ok\n";
      add_header Content-Type text/plain;
    }
  }
}
