server:
  port: 8081
# Persistent connections in every variant (ZT-Tax lesson: with keep-alive the
# mTLS handshake is amortised over the connection pool instead of being paid
# every 100 requests, Tomcat's default).
  tomcat:
    max-keep-alive-requests: -1
    keep-alive-timeout: 60s

# Zero Trust primitives are selected with independent flags (ZT_AC4A, ZT_MTLS,
# ZT_SR, ZT_RA — see testbed/variants/*.env). mTLS is enabled through the
# SERVER_SSL_* / SPRING_KAFKA_SSL_* variables of testbed/zt/mtls-on.*.env.

spring:
  application:
    name: ms-user
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      timeout: 1000ms
      connect-timeout: 1000ms
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  server:
    port: 8191
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

jwt:
  secret: ${JWT_SECRET:trustlens-dev-secret-key-256bit!!}
  expiration-ms: 3600000
